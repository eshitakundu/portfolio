<body data-theme="light">

<div class="boot" id="boot" aria-hidden="true">
  <div class="boot-mark">
    <svg viewBox="0 0 24 24" width="46" height="46" aria-hidden="true">
      <rect x="1" y="1" width="10" height="10" fill="#ff6a00"/>
      <rect x="13" y="1" width="10" height="10" fill="#7cbb00"/>

  </div>

</div>

<main class="desktop" id="desktop">
  <div class="wallpaper-fallback" aria-hidden="true"></div>
  <div class="wallpaper-vignette" aria-hidden="true"></div>

  <div class="desktop-watermark" id="terminalHero">
    <div class="term-titlebar">
      <span class="term-dot"></span>
      <span class="term-path">~/eshita/portfolio</span>
      <button class="term-close" id="termClose" aria-label="Close terminal">×</button>
    </div>
    <pre class="term-body" id="termBody" aria-label="Terminal-style introduction"></pre>
  </div>

  <div class="desktop-icons" id="desktopIcons" aria-label="Desktop apps"></div>
  <div class="windows-layer" id="windowsLayer"></div>
</main>

<div class="agent-pet" id="agentPet" title="drag me anywhere" role="img" aria-label="A small decorative robot mascot you can drag around the page" tabindex="0">
  <svg viewBox="0 0 110 130" width="54" height="64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <radialGradient id="petBodyG" cx="40%" cy="32%" r="70%">
        <stop offset="0%"   stop-color="#ffffff"/>
        <stop offset="55%"  stop-color="#f0ecdc"/>
        <stop offset="100%" stop-color="#b9b09a"/>
      </radialGradient>
      <linearGradient id="petVisorG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#0a0a0f"/>
        <stop offset="100%" stop-color="#1a1822"/>
      </linearGradient>
    </defs>

    <!-- Ground shadow -->
    <ellipse class="pet-shadow" cx="55" cy="124" rx="30" ry="3.5" fill="#000" opacity="0.45"/>

    <!-- Egg body -->
    <ellipse cx="55" cy="58" rx="40" ry="46" fill="url(#petBodyG)" stroke="#9e9580" stroke-width="0.6"/>
    <ellipse cx="38" cy="30" rx="15" ry="11" fill="#fff" opacity="0.55" transform="rotate(-22 38 30)"/>

    <!-- Floating arm orbs -->
    <ellipse cx="12" cy="70" rx="6.5" ry="9.5" fill="url(#petBodyG)" stroke="#9e9580" stroke-width="0.5"/>
    <ellipse cx="98" cy="70" rx="6.5" ry="9.5" fill="url(#petBodyG)" stroke="#9e9580" stroke-width="0.5"/>

    <!-- Visor -->
    <path d="M 12 42 Q 55 24 98 42 Q 98 66 55 68 Q 12 66 12 42 Z"
          fill="url(#petVisorG)" stroke="#222" stroke-width="0.5"/>
    <path d="M 22 38 Q 50 30 82 37 Q 70 44 50 45 Q 30 45 22 38 Z" fill="#fff" opacity="0.07"/>

    <!-- Blush cheeks -->
    <g class="pet-cheeks">
      <ellipse cx="27" cy="60" rx="5.5" ry="3" fill="#c2563b" opacity=".5"/>
      <ellipse cx="83" cy="60" rx="5.5" ry="3" fill="#c2563b" opacity=".5"/>
    </g>

    <!-- Soft glow halos behind the eyes -->
    <ellipse class="pet-eye-halo" cx="38" cy="50" rx="10" ry="6"/>
    <ellipse class="pet-eye-halo" cx="72" cy="50" rx="10" ry="6"/>

    <!-- CALM eyes: simple bright ovals (track cursor subtly) -->
    <g class="pet-calm-eyes">
      <ellipse class="pet-eye-fill pet-pupil" cx="38" cy="50" rx="6" ry="4"/>
      <ellipse class="pet-eye-fill pet-pupil" cx="72" cy="50" rx="6" ry="4"/>
    </g>

    <!-- SAD >< eyes shown only when picked up -->
    <g class="pet-panic-only">
      <path class="pet-eye-stroke" d="M 30 44 L 46 50 L 30 56"
            stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="pet-eye-stroke" d="M 80 44 L 64 50 L 80 56"
            stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </svg>
</div>

<nav class="dock" id="dock" aria-label="Taskbar">

    </button>

    </a>
    <span class="menubar-clock" id="clock"></span>
  </div>
